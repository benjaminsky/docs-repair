name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (metadiscourse-audit)
        working-directory: skills/metadiscourse-audit/scripts
        run: python3 test_scan.py
      - name: Run unit tests (ai-slop-audit)
        working-directory: skills/ai-slop-audit/scripts
        run: python3 test_scan.py
      - name: Run unit tests (lie-detector)
        working-directory: skills/lie-detector/scripts
        run: python3 test_scan.py

  scanner:
    name: scanner exit codes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # --check is what a caller wires into their own CI, so both directions of
      # it are worth holding still. The eval fixtures are planted: repo-a's
      # CLAUDE.md is clean by construction, its docs/ are dirty by construction.
      - name: A clean file exits 0
        run: python3 skills/metadiscourse-audit/scripts/scan.py --check evals/fixtures/repo-a/CLAUDE.md

      - name: A file with candidates exits 1
        run: |
          if python3 skills/metadiscourse-audit/scripts/scan.py --check \
              evals/fixtures/repo-a/docs/ingest.md; then
            echo "::error::--check exited 0 on a fixture planted with candidates"
            exit 1
          fi

      - name: Scanning nothing exits 2
        run: |
          set +e
          python3 skills/metadiscourse-audit/scripts/scan.py .github/workflows
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 when no standing markdown is found, got $status"
            exit 1
          fi

      # repo-c is planted for ai-slop-audit the same way repo-a is planted
      # for metadiscourse-audit: CLAUDE.md clean, docs/ dirty.
      - name: ai-slop-audit — a clean file exits 0
        run: python3 skills/ai-slop-audit/scripts/scan.py --check evals/fixtures/repo-c/CLAUDE.md

      - name: ai-slop-audit — a file with candidates exits 1
        run: |
          if python3 skills/ai-slop-audit/scripts/scan.py --check \
              evals/fixtures/repo-c/docs/setup.md; then
            echo "::error::--check exited 0 on a fixture planted with candidates"
            exit 1
          fi

      - name: ai-slop-audit — scanning nothing exits 2
        run: |
          set +e
          python3 skills/ai-slop-audit/scripts/scan.py .github/workflows
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 when no standing markdown is found, got $status"
            exit 1
          fi

      # repo-c/src is dirty by construction too, but in comments: without
      # --code a directory walk must not touch it, with --code it must.
      - name: ai-slop-audit — code comments are scanned only with --code
        run: |
          set +e
          python3 skills/ai-slop-audit/scripts/scan.py --check evals/fixtures/repo-c/src
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 without --code on a code-only directory, got $status"
            exit 1
          fi
          if python3 skills/ai-slop-audit/scripts/scan.py --check --code \
              evals/fixtures/repo-c/src; then
            echo "::error::--check --code exited 0 on a fixture planted with comment candidates"
            exit 1
          fi

      # repo-a/src is dirty by construction too, but in comments: without
      # --code a directory walk must not touch it, with --code it must.
      - name: Code comments are scanned only with --code
        run: |
          set +e
          python3 skills/metadiscourse-audit/scripts/scan.py --check evals/fixtures/repo-a/src
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 without --code on a code-only directory, got $status"
            exit 1
          fi
          if python3 skills/metadiscourse-audit/scripts/scan.py --check --code \
              evals/fixtures/repo-a/src; then
            echo "::error::--check --code exited 0 on a fixture planted with comment candidates"
            exit 1
          fi

      # repo-d is planted for lie-detector: docs/ makes claims src/relay.py
      # contradicts. What CI pins here is not the verdicts — those need a
      # reader — but the draw: a published sample is worthless if the same
      # seed stops selecting the same claims, and nothing else would notice.
      - name: lie-detector — a corpus with claims exits 0
        run: python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d/docs -n 3 --seed ci

      - name: lie-detector — a corpus with no claims exits 2
        run: |
          set +e
          python3 skills/lie-detector/scripts/scan.py .github/workflows
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 when there is nothing to sample, got $status"
            exit 1
          fi

      - name: lie-detector — the same seed draws the same claims
        run: |
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d \
              -n 5 --seed ci --json > /tmp/draw-a.json
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d \
              -n 5 --seed ci --json > /tmp/draw-b.json
          python3 -c 'import json, sys; \
            a = json.load(open("/tmp/draw-a.json")); \
            b = json.load(open("/tmp/draw-b.json")); \
            same = [c["id"] for c in a["sample"]] == [c["id"] for c in b["sample"]]; \
            print("::error::the same seed drew a different sample") if not same else None; \
            print("::error::the corpus digest is not stable") if a["corpus"] != b["corpus"] else None; \
            sys.exit(0 if same and a["corpus"] == b["corpus"] else 1)'

      - name: lie-detector — --verify reproduces a draw, and notices an edited corpus
        run: |
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d \
              -n 5 --seed ci --json > /tmp/manifest.json
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d \
              --verify /tmp/manifest.json
          cp evals/fixtures/repo-d/docs/relay.md /tmp/relay.md.bak
          printf '\nThe drain exits with status 7 after every flush.\n' \
              >> evals/fixtures/repo-d/docs/relay.md
          set +e
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d \
              --verify /tmp/manifest.json
          status=$?
          set -e
          cp /tmp/relay.md.bak evals/fixtures/repo-d/docs/relay.md
          if [ "$status" -ne 1 ]; then
            echo "::error::--verify exited $status on a corpus that changed under it"
            exit 1
          fi

      - name: lie-detector — code comments are sampled only with --code
        run: |
          set +e
          python3 skills/lie-detector/scripts/scan.py evals/fixtures/repo-d/src
          status=$?
          set -e
          if [ "$status" -ne 2 ]; then
            echo "::error::expected exit 2 without --code on a code-only directory, got $status"
            exit 1
          fi
          python3 skills/lie-detector/scripts/scan.py --code -n 2 --seed ci \
              evals/fixtures/repo-d/src

  manifests:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # A malformed manifest does not break a clone, it breaks every install
      # from the marketplace, and nothing else here would notice.
      - name: Validate plugin.json and marketplace.json
        run: |
          python3 - <<'PY'
          import json, os, sys

          fail = []

          with open(".claude-plugin/plugin.json", encoding="utf-8") as fh:
              plugin = json.load(fh)
          for key in ("name", "description", "version"):
              if not plugin.get(key):
                  fail.append(f"plugin.json is missing {key}")

          with open(".claude-plugin/marketplace.json", encoding="utf-8") as fh:
              market = json.load(fh)
          for key in ("name", "owner", "plugins"):
              if not market.get(key):
                  fail.append(f"marketplace.json is missing {key}")

          entries = market.get("plugins") or []
          if not entries:
              fail.append("marketplace.json lists no plugins")

          for entry in entries:
              name = entry.get("name", "<unnamed>")
              source = entry.get("source")
              if not source:
                  fail.append(f"{name}: no source")
                  continue
              if isinstance(source, str) and source.startswith("."):
                  if not os.path.isdir(source):
                      fail.append(f"{name}: source {source} does not exist")
                  elif source in ("./", ".") and entry["name"] != plugin["name"]:
                      # A self-sourced entry installs this repo's own plugin.json,
                      # so the two names have to agree or the install resolves to
                      # a plugin the catalogue never advertised.
                      fail.append(
                          f"{name}: marketplace name does not match plugin.json "
                          f"name {plugin['name']!r}"
                      )
              if entry.get("version") and entry["version"] != plugin.get("version"):
                  fail.append(
                      f"{name}: marketplace version {entry['version']} does not "
                      f"match plugin.json version {plugin.get('version')}"
                  )

          for problem in fail:
              print(f"::error::{problem}")
          sys.exit(1 if fail else 0)
          PY

      # SKILL.md carries the frontmatter that decides whether the skill is ever
      # reached, so its absence should fail loudly rather than install quietly.
      - name: Every skill has frontmatter with a description
        run: |
          python3 - <<'PY'
          import glob, sys

          paths = sorted(glob.glob("skills/*/SKILL.md"))
          if not paths:
              print("::error::no skills/*/SKILL.md found")
              sys.exit(1)

          fail = False
          for path in paths:
              with open(path, encoding="utf-8") as fh:
                  text = fh.read()

              if not text.startswith("---\n"):
                  print(f"::error::{path} has no YAML frontmatter")
                  fail = True
                  continue

              end = text.find("\n---", 4)
              if end == -1:
                  print(f"::error::{path} frontmatter is not closed")
                  fail = True
                  continue

              front = text[4:end]
              if "description:" not in front:
                  print(f"::error::{path} frontmatter has no description")
                  fail = True
          sys.exit(1 if fail else 0)
          PY
